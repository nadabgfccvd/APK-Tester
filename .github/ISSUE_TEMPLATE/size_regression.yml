name: Size Regression
description: Regressão de tamanho do flagship Behemoth (gate [850 MB, 1000 MB]).
labels: [size_regression]
body:
  - type: textarea
    id: bytes
    attributes:
      label: Bytes por categoria
      description: Cole o contracts/flagship/size-report.csv do build problemático (textures, meshes, shaders, audio, dex, arsc, so, locales, resources, other).
      render: csv
    validations:
      required: true
  - type: input
    id: total-size
    attributes:
      label: Tamanho total do APK (MB)
      description: "Ex.: 842.3 MB (abaixo do piso de 850 MB do gate)."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Commit, geradores e flags usados no build (tools/build-variants.sh, gen-textures/gen-meshes/gen-audio), e o que mudou desde o último size-report dentro da faixa.
  - type: textarea
    id: drift
    attributes:
      label: Drift vs último relatório
      description: Saída do drift check do workflow Size Gate (falha acima de +2%).
