# CI do APK Tester — A0 (esqueleto), A1 (flagship), A2 (escada+torture),
# A3 (Tier C) e A4 (builds REAIS Tier A) entregues.
# O job tier-a-engines compila os 14 engines "build: real" com toolchains
# reais e pinadas (tools/setup-tier-a-toolchain.sh) via o orquestrador
# tools/build-tier-a.py; contracts-check e lint já são finais.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, shellcheck, compileall, bash -n)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A9/roadmap 6.1: lint REAL de Python (ruff, seleção E4/E7/E9+F no
      # ruff.toml — a decisão de formato está documentada lá: sem
      # formatador automático; o diff é o revisor do estilo).
      - name: ruff (tools/ bot/ — pyflakes + erros pycodestyle)
        run: |
          python3 -m pip install --quiet ruff==0.17.2
          ruff check tools bot

      - name: shellcheck (tools/*.sh, scripts/*.sh, engines build.sh)
        run: |
          shopt -s nullglob
          files=(tools/*.sh scripts/*.sh suites/engines/*/build.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "[lint] nenhum script .sh ainda; nada a checar"
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: python3 -m compileall (tools, scripts)
        run: |
          args=()
          [ -d tools ] && args+=(tools)
          [ -d scripts ] && args+=(scripts)
          if [ "${#args[@]}" -eq 0 ]; then
            echo "[lint] nenhum diretorio tools/ ou scripts/ ainda"
            exit 0
          fi
          python3 -m compileall "${args[@]}"

      - name: bash -n (sintaxe de todos os .sh)
        run: |
          shopt -s nullglob
          status=0
          for f in tools/*.sh scripts/*.sh suites/engines/*/build.sh; do
            bash -n "$f" || status=1
          done
          exit "$status"

  # A9/roadmap 6.2: TODOS os selftests dos geradores num job barato. Antes
  # só fixture-pack/gen-engine-fixtures/build-tier-a/b/v1-gate rodavam no CI
  # — as asserções estruturais dos 11 gen-* restantes (KTX2 spec-completo,
  # WAV EXTENSIBLE, ladder zero-drift, arsc, dex-stress, strings, icons...)
  # só rodavam localmente. Roda sem toolchain Android (stdlib only); o
  # snapshot-aosp faz 1 fetch do AOSP (~500 KB). Inclui o APKBot --local
  # com o check locale_sync (puramente local) para exercitar os checks em
  # cada PR.
  gen-selftests:
    name: "Selftests (A9): todos os geradores + APKBot local"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selftest de cada tools/*.py que expõe --selftest
        run: |
          status=0
          for t in tools/*.py; do
            if grep -q -- "--selftest" "$t"; then
              echo "::group::python3 $t --selftest"
              python3 "$t" --selftest || status=1
              echo "::endgroup::"
            fi
          done
          exit "$status"

      - name: APKBot local (check locale_sync em cada PR)
        run: |
          python3 bot/apkbot.py --local --check locale_sync
          git checkout -- bot/state/bot-state.json 2>/dev/null || true

  # Tier B contratos (A7): o PR valida o ORQUESTRADOR e o zero drift dos
  # contratos (selftest + sync + plan-only dos 9 engines); a build REAL das
  # toolchains pesadas fica gated no engines-nightly.yml (ADR 0002).
  tier-b-contracts:
    name: "Tier B contratos (A7): selftest + sync zero drift"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selftest do orquestrador Tier B (9 planos + drift)
        run: python3 tools/build-tier-b.py --selftest

      - name: Zero drift dos contratos Tier B (sync + diff)
        run: |
          python3 tools/build-tier-b.py --sync-contracts
          git diff --exit-code -- \
            suites/engines/engine-04-scala/expected-engines.json \
            suites/engines/engine-13-flutter/expected-engines.json \
            suites/engines/engine-14-react-native/expected-engines.json \
            suites/engines/engine-15-cordova/expected-engines.json \
            suites/engines/engine-17-nativescript/expected-engines.json \
            suites/engines/engine-22-lua-defold/expected-engines.json \
            suites/engines/engine-23-godot/expected-engines.json \
            suites/engines/engine-26-qt-qml/expected-engines.json \
            suites/engines/engine-28-avalonia-dotnet/expected-engines.json
          echo "[A7] zero drift: contratos por diretório == contrato canônico"

      - name: Plan-only smoke via build.sh de cada engine
        run: |
          for e in engine-04-scala engine-13-flutter engine-14-react-native \
                   engine-15-cordova engine-17-nativescript \
                   engine-22-lua-defold engine-23-godot engine-26-qt-qml \
                   engine-28-avalonia-dotnet; do
            "suites/engines/$e/build.sh" --plan-only > /dev/null
            echo "[A7] $e: plano ok"
          done

  # Tier A real (A4): 14 engines com build REAL — toolchains pinadas por
  # engine (javac/kotlinc/groovyc/NDK clang/cargo-ndk/gomobile/zig cc/
  # haxe/wat2wasm/hermesc/gradle+chaquopy), pack pelo mesmo caminho do
  # fixture-pack (aapt2+d8+zipalign+apksigner) e verificação contra o
  # contrato canônico expected-engines.json (artefatos + dex/elf-strings).
  tier-a-engines:
    name: "Tier A (A4): ${{ matrix.engine }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine:
          - engine-01-java
          - engine-02-kotlin
          - engine-03-kmp
          - engine-06-groovy
          - engine-07-c-ndk
          - engine-08-cpp-ndk
          - engine-09-rust
          - engine-10-go
          - engine-12-zig
          - engine-16-tauri
          - engine-24-haxe
          - engine-25-python-chaquopy
          - engine-30-wasm-in-app
          - engine-31-hybrid
        include:
          - { engine: engine-09-rust, need_rust: true }
          - { engine: engine-16-tauri, need_rust: true }
          - { engine: engine-30-wasm-in-app, need_rust: true }
          - { engine: engine-31-hybrid, need_rust: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Rust stable (para engines com crate nativo)
        if: matrix.need_rust
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="${HOME}/.cargo/bin:${PATH}"
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi
          rustup update stable
          rustc --version

      - name: Selftest do orquestrador Tier A
        run: python3 tools/build-tier-a.py --selftest

      - name: Zero drift dos contratos Tier A (sync + diff)
        run: |
          python3 tools/build-tier-a.py --sync-contracts
          git diff --exit-code -- \
            "suites/engines/${{ matrix.engine }}/expected-engines.json"
          echo "[A4] zero drift: contrato por diretório == contrato canônico"

      - name: Toolchain real + build do engine
        run: |
          source tools/setup-tier-a-toolchain.sh "${{ matrix.engine }}"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p dist reports
          python3 tools/build-tier-a.py \
            --engine "${{ matrix.engine }}" \
            --out dist --report "reports/${{ matrix.engine }}.json" \
            --aapt2 "${BT}/aapt2" --d8 "${BT}/d8" \
            --apksigner "${BT}/apksigner" --zipalign "${BT}/zipalign"

      - name: Verificar o APK contra o contrato (artefatos do detector)
        run: |
          python3 tools/build-tier-a.py \
            --verify-apk "dist/${{ matrix.engine }}.apk" \
            --engine "${{ matrix.engine }}"

      - name: Determinismo do pack (zig, duas passadas + apk-mode)
        if: matrix.engine == 'engine-12-zig'
        run: |
          source tools/setup-tier-a-toolchain.sh "engine-12-zig"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          python3 tools/build-tier-a.py --engine engine-12-zig \
            --out dist2 \
            --aapt2 "${BT}/aapt2" --d8 "${BT}/d8" \
            --apksigner "${BT}/apksigner" --zipalign "${BT}/zipalign"
          bash tools/verify-deterministic.sh --mode apk \
            --apk1 dist/engine-12-zig.apk --apk2 dist2/engine-12-zig.apk

      - name: Upload do APK + report (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: tier-a-${{ matrix.engine }}
          path: |
            dist/${{ matrix.engine }}.apk
            reports/${{ matrix.engine }}.json
          if-no-files-found: error

  # contracts-check: valida JSON dos answer keys e o schema de suites.json.
  contracts-check:
    name: Contratos (JSON válido + schema)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar contracts/**/*.json e suites.json (schema_version == 1)
        run: |
          python3 -c "
          import glob, json, sys
          files = sorted(glob.glob('contracts/**/*.json', recursive=True))
          if not files:
              print('[esqueleto A0] nenhum JSON em contracts/ ainda')
              sys.exit(0)
          for f in files:
              json.load(open(f, encoding='utf-8'))
              print('JSON ok:', f)
          suites = json.load(open('contracts/suites.json', encoding='utf-8'))
          assert suites.get('schema_version') == 1, 'suites.json schema_version != 1'
          print('suites.json: schema_version == 1 ok,', len(suites.get('suites', [])), 'suites')
          "

  # A8: gate v1.0 — criterios estaticos da Definition of Done + zero drift
  # do contrato commitado (a parte dinamica e lei do workflow Release).
  v1-gate:
    name: "Gate v1.0 (A8): DoD estatico + zero drift do contrato"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selftest do gate (10 criterios do DoD)
        run: python3 tools/v1-gate.py --selftest

      - name: Zero drift do contrato do gate (sync + diff)
        run: |
          python3 tools/v1-gate.py --sync
          git diff --exit-code -- contracts/v1-gate.json
          echo "[A8] zero drift: contracts/v1-gate.json regenerado == commitado"

  # A1: build real do flagship "Behemoth" (Gradle, flavors classic/modern).
  # O gerador de manifesto/auditorias roda de novo e o git diff prova zero drift.
  flagship-skeleton:
    name: "Flagship Behemoth (A1): classic + modern"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Regenerar manifesto + auditorias (zero drift contra o commit)
        run: |
          python3 tools/gen-flagship-manifest.py --out .
          git diff --exit-code -- \
            suites/flagship/AndroidManifest.xml \
            suites/flagship/app/src/main/AndroidManifest.xml \
            suites/flagship/app/src/classic/AndroidManifest.xml \
            suites/flagship/app/src/modern/AndroidManifest.xml \
            contracts/flagship/permissions-audit.md \
            contracts/flagship/manifest-audit.md \
            contracts/flagship/manifest.json \
            suites/flagship/app/src/main/assets/permissions/
          echo "[A1] zero drift: manifesto/auditorias regeneradas == commitadas"

      - name: Cross-check de contagens (manifesto vs registry vs auditoria)
        run: |
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          ns = "{http://schemas.android.com/apk/res/android}"
          reg = json.loads(Path("contracts/flagship/permissions-registry.json").read_text(encoding="utf-8"))
          platform = {e["name"] for e in reg["permissions"]}
          root = ET.parse("suites/flagship/AndroidManifest.xml").getroot()
          used = {e.attrib[f"{ns}name"] for e in root if e.tag.endswith("uses-permission")}
          used23 = {e.attrib[f"{ns}name"] for e in root if e.tag.endswith("uses-permission-sdk-23")}
          assert used == platform, f"manifesto vs registry: {len(used ^ platform)} divergentes"
          assert used23 == set(reg["flagship_usage"]["uses_permission_sdk_23"])
          audit = Path("contracts/flagship/permissions-audit.md").read_text(encoding="utf-8")
          rows = set(re.findall(r"^\|\s*(android\.permission\.[A-Z0-9_]+)\s*\|", audit, re.M))
          assert rows == platform, "auditoria vs registry divergente"
          print(f"[A1] contagens ok: {len(platform)} permissoes, {len(used23)} sdk-23")
          PY

      - name: Build (Gradle, classic+modern x debug)
        run: |
          cd suites/flagship
          ./gradlew --no-daemon -PbulkPreset=quick :app:assembleClassicDebug :app:assembleModernDebug

      # A9/roadmap 3.1: os 48 KTX2 do genTextures + os 3 do genBulk precisam
      # passar no validador oficial da Khronos (ktx2check 4.4.2). O -q faz o
      # exit code refletir validade (2 = erro estrutural).
      - name: KTX2 spec-oficial (ktx2check sobre as texturas geradas)
        run: |
          set -euo pipefail
          curl -sL --retry 3 -o /tmp/ktx.tar.bz2 \
            "https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2"
          tar -xjf /tmp/ktx.tar.bz2 -C /tmp
          KTXCHECK=/tmp/KTX-Software-4.4.2-Linux-x86_64/bin/ktx2check
          n=0
          while IFS= read -r f; do
            "${KTXCHECK}" -q "${f}"
            n=$((n + 1))
          done < <(find suites/flagship/app/build/gen -name '*.ktx2' | LC_ALL=C sort)
          # 48 do genTextures (4 materiais x 4 mapas x 3 formatos) + 3 do
          # genBulk (preset quick) = 51
          test "${n}" -ge 51
          echo "[A9] ktx2check: ${n} texturas KTX2 aprovadas (zero erros)"

      - name: Verificar permissoes no APK binario (aapt2)
        run: |
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          APK="suites/flagship/app/build/outputs/apk/classic/debug/app-classic-debug.apk"
          test -f "${APK}"
          COUNT="$("${AAPT2}" dump xmltree "${APK}" --file AndroidManifest.xml | grep -c 'E: uses-permission')"
          echo "[A1] uses-permission no APK binario: ${COUNT}"
          test "${COUNT}" -ge 1004

      - name: Upload dos APKs (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: flagship-skeleton-apks
          path: suites/flagship/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  # A5: pilar 3D/shaders — motor :sim3d (Q16 inteiro) com golden zero-drift,
  # paridade Java/C++ da fisica, validacao glslang dos 239 programas da
  # shader-library e build do flagship com os ativos 3D empacotados.
  flagship-3d:
    name: "Flagship 3D/Shaders (A5): sim3d golden + shader-library + assets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Instalar glslang (validador GLSL ES 3.1)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools

      - name: Golden selftest do motor (:sim3d)
        run: |
          cd suites/flagship
          ./gradlew --no-daemon :sim3d:goldenSelftest

      - name: Golden zero drift (reexecucao byte a byte vs contrato)
        run: |
          cd suites/flagship
          ./gradlew --no-daemon :sim3d:goldenVerify
          git diff --exit-code -- contracts/flagship/sim3d-golden.json
          echo "[A5] zero drift: sim3d-golden.json reproduzido identico"

      - name: Paridade nativa da fisica (Java == C++ JNI fallback)
        run: |
          cd suites/flagship
          ./gradlew --no-daemon :sim3d:compileJava
          CP="sim3d/build/classes/java/main"
          cc -shared -fPIC -O2 -fwrapv \
            -I"${JAVA_HOME}/include" -I"${JAVA_HOME}/include/linux" \
            sim3d/src/main/cpp/sim3d_native.cpp -o /tmp/libsim3d_native.so
          java -Xmx1g -Djava.library.path=/tmp -cp "${CP}" \
            dev.apktester.behemoth.sim3d.Sim3dGolden --parity sim3d_native
          echo "[A5] paridade inteira Java/C++ provada"

      - name: Gerar shader-library (239 programas) e validar com glslang
        run: |
          python3 tools/gen-shaders.py --out /tmp/gen3d --seed 20261022
          status=0
          n=0
          for f in /tmp/gen3d/shader-library/shaders/*/*.vert \
                   /tmp/gen3d/shader-library/shaders/*/*.frag \
                   /tmp/gen3d/shader-library/shaders/*/*.comp; do
            glslangValidator "${f}" || status=1
            n=$((n+1))
          done
          echo "[A5] glslang: ${n} arquivos GLSL ES 3.1 validados"
          test "${status}" -eq 0

      - name: Consistencia do index.json da shader-library (sha256 + uniforms)
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/gen3d/shader-library")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          assert index["count"] == len(index["programs"]) == 239
          stages = {"graphics": 0, "compute": 0}
          for prog in index["programs"]:
              digest = hashlib.sha256()
              for rel in prog["files"]:
                  data = (Path("/tmp/gen3d") / rel).read_bytes()
                  digest.update(data)
              assert digest.hexdigest() == prog["sha256"], prog["id"]
              spv = Path("/tmp/gen3d") / prog["spirv"]["file"]
              blob = spv.read_bytes()
              assert blob[:4] == b"\x03\x02\x23\x07", prog["id"]
              assert len(blob) == prog["spirv"]["bytes"]
              stages[prog["stage"]] += 1
          assert stages["graphics"] == 215 and stages["compute"] == 24, stages
          print(f"[A5] index.json ok: 239 programas ({stages['graphics']} graphics,"
                f" {stages['compute']} compute), sha256 + blobs SPIR-V style conferidos")
          PY

      - name: Build do flagship com ativos 3D (classic + modern debug)
        run: |
          cd suites/flagship
          ./gradlew --no-daemon -PbulkPreset=quick :app:assembleClassicDebug :app:assembleModernDebug

      - name: Assegurar ativos 3D dentro do APK binario
        run: |
          APK="suites/flagship/app/build/outputs/apk/classic/debug/app-classic-debug.apk"
          test -f "${APK}"
          python3 - <<'PY'
          import json, zipfile
          apk = "suites/flagship/app/build/outputs/apk/classic/debug/app-classic-debug.apk"
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
          def need(path):
              assert path in names, f"asset ausente do APK: {path}"
          need("assets/shader-library/index.json")
          with zipfile.ZipFile(apk) as z:
              index = json.loads(z.read("assets/shader-library/index.json"))
          shaders = sum(1 for n in names if n.startswith("assets/shader-library/shaders/"))
          assert index["count"] == 239, index["count"]
          # 215 graficos x (vert+frag+spv) + 24 compute x (comp+spv) = 693
          assert shaders == 693, f"arquivos de shader no APK: {shaders}"
          meshes = [n for n in names if n.startswith("assets/mesh/")]
          audio = [n for n in names if n.startswith("assets/audio/")]
          textures = [n for n in names if n.startswith("assets/textures/")]
          assert any("terrain_1024" in m for m in meshes), meshes
          assert any("crowd_50000" in m for m in meshes)
          wavs = [a for a in audio if a.endswith(".wav")]
          # gen-audio tambem escreve audio/index.json + audio/manifest.json (contrato)
          assert len(wavs) == 2, audio
          ktx2 = [t for t in textures if t.endswith(".ktx2")]
          # gen-textures tambem escreve textures/index.json + manifest.json (contrato)
          assert len(ktx2) == 48, len(ktx2)  # 4 materiais x 4 mapas x 3 formatos
          print(f"[A5] APK ok: {shaders} arquivos de shader, {len(meshes)} malhas,"
                f" {len(audio)} audio, {len(textures)} texturas")
          PY

      - name: Upload dos APKs (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: flagship-3d-apks
          path: suites/flagship/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  # A2: escada minSdk 9->36 — o MESMO app mínimo (1 activity + 1 service +
  # 1 receiver + 1 provider, 0 permissões) construído em 12 degraus. Os
  # flavors são lidos de rungs.properties (gerado) em tempo de configuração:
  # zero drift por construção entre build e answer key.
  sdk-ladder:
    name: "SDK Ladder (A2): 12 degraus minSdk 9-36"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Regenerar escada + contratos (zero drift contra o commit)
        run: |
          python3 tools/gen-ladder.py --out .
          git diff --exit-code -- \
            suites/sdk-ladder/rungs.properties \
            suites/sdk-ladder/app/src/main/assets/ladder/rungs.json \
            contracts/sdk-ladder/
          echo "[A2] zero drift: escada regenerada == commitada"

      - name: Build (Gradle, 12 flavors debug em uma invocação)
        run: |
          cd suites/sdk-ladder
          ./gradlew --no-daemon :app:assembleDebug

      - name: Validar os 12 APKs (badging + componentes + zero permissões)
        run: |
          AAPT2="${ANDROID_HOME}/build-tools/35.0.0/aapt2"
          python3 - "$AAPT2" <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          aapt2 = sys.argv[1]
          root = Path("suites/sdk-ladder/app/build/outputs/apk")
          apks = sorted(root.glob("*/debug/*.apk"))
          assert len(apks) == 12, f"esperava 12 APKs, achei {len(apks)}: {apks}"
          for apk in apks:
              flavor = apk.parent.parent.name              # minsdk09..minsdk36
              min_sdk = int(flavor.replace("minsdk", ""))
              badging = subprocess.run(
                  [aapt2, "dump", "badging", str(apk)],
                  capture_output=True, text=True, check=True).stdout
              m = re.search(r"^package: name='([^']+)' versionCode='(\d+)'",
                            badging, re.M)
              assert m, f"badging sem package: {apk}"
              name, vcode = m.group(1), int(m.group(2))
              assert name == f"dev.apktester.ladder.{flavor}", \
                  f"applicationId inesperado em {apk}: {name}"
              assert vcode == min_sdk, f"versionCode != minSdk em {apk}: {vcode}"
              assert f"minSdkVersion:'{min_sdk}'" in badging, \
                  f"minSdkVersion errado em {apk}"
              assert "targetSdkVersion:'36'" in badging, f"targetSdk errado em {apk}"
              tree = subprocess.run(
                  [aapt2, "dump", "xmltree", str(apk),
                   "--file", "AndroidManifest.xml"],
                  capture_output=True, text=True, check=True).stdout
              comps = len(re.findall(
                  r"^ +E: (activity|service|receiver|provider) ", tree, re.M))
              assert comps == 4, \
                  f"esperava 4 componentes em {apk}, achei {comps}"
              perms = len(re.findall(r"^ +E: uses-permission ", tree, re.M))
              assert perms == 0, \
                  f"a escada não declara permissões, achei {perms} em {apk}"
              print(f"[A2] ok degrau: {flavor} minSdk={min_sdk} "
                    f"versionCode={vcode} 4 componentes 0 permissões")
          PY

      - name: Copiar APKs para os diretórios dos contratos (minsdk-NN)
        run: |
          for d in 09 12 14 16 19 21 23 26 29 33 35 36; do
            mkdir -p "suites/sdk-ladder/minsdk-${d}"
            cp "suites/sdk-ladder/app/build/outputs/apk/minsdk${d}/debug/app-minsdk${d}-debug.apk" \
               "suites/sdk-ladder/minsdk-${d}/app-debug.apk"
          done
          ls -l suites/sdk-ladder/minsdk-*/app-debug.apk

      - name: Upload dos APKs (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: sdk-ladder-apks
          path: suites/sdk-ladder/minsdk-*/app-debug.apk
          if-no-files-found: error

  # A2: pacote parser-torture — 10 fixtures com uma patologia cada, empacotadas
  # com a toolchain real (aapt2+d8+zip+zipalign+apksigner) e validadas uma a uma.
  parser-torture:
    name: "Parser Torture (A2): 10 fixtures + validações"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Regenerar contratos do pacote (zero drift contra o commit)
        run: |
          python3 tools/gen-torture-contracts.py --out .
          python3 tools/gen-trap-manifest.py --out suites/parser-torture/exported-audit
          python3 tools/gen-arsc-stress.py --out suites/parser-torture/huge-arsc
          git diff --exit-code -- \
            contracts/parser-torture/ \
            suites/parser-torture/exported-audit/AndroidManifest.xml \
            suites/parser-torture/exported-audit/traps-report.json \
            suites/parser-torture/huge-arsc/arsc-report.json
          echo "[A2] zero drift: contratos + manifesto de armadilhas + report do arsc"

      - name: Selftest dos empacotadores
        run: python3 tools/fixture-pack.py --selftest

      - name: Empacotar as 11 fixtures (toolchain real do SDK)
        run: |
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p dist
          for f in minSdk9 sig-v1-only sig-v2-only sig-v3-only unaligned zip64 \
                   huge-arsc multidex-8 unknown-perms exported-audit obfuscated; do
            python3 tools/fixture-pack.py --fixture "$f" --out dist \
              --aapt2 "${BT}/aapt2" --d8 "${BT}/d8" \
              --apksigner "${BT}/apksigner" --zipalign "${BT}/zipalign"
          done
          ls -l dist/

      - name: Validar cada fixture (parsers, assinaturas, estrutura)
        run: |
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          python3 - "${BT}" <<'PY'
          import hashlib, json, re, subprocess, sys, zipfile
          from pathlib import Path
          bt = Path(sys.argv[1])
          dist = Path("dist")

          def xmltree(apk):
              return subprocess.run(
                  [str(bt / "aapt2"), "dump", "xmltree", str(apk),
                   "--file", "AndroidManifest.xml"],
                  capture_output=True, text=True, check=True).stdout

          # --- assinaturas: cada modo tem o ESQUEMA EXATO prometido.
          # Regex tolerante à variação do apksigner entre versões de
          # build-tools: verbo ("Verified"/"Verificied" histórico) fora do
          # match e descrição em parênteses opcional — ex. build-tools 35:
          # "Verified using v1 scheme (JAR signing): true". O range de
          # plataformas do verify é LIMITADO por fixture: apksigner simula
          # a instalação (API 24+ exige v2 "ou posterior") e estas fixtures
          # são ALVOS DE PARSER, não de instalação — v1-only se verifica
          # contra 9..23, v2-only contra 24+, v3-only contra 28+.
          def scheme_flag(out, scheme):
              m = re.search(
                  rf"\b{scheme}\s+scheme(?:\s*\([^)]*\))?:\s*(true|false)\b",
                  out, re.I)
              return m.group(1).lower() if m else None

          schemes = {
              "sig-v1-only.apk": ((True, False, False),
                                  ["--min-sdk-version", "9",
                                   "--max-sdk-version", "23"]),
              "sig-v2-only.apk": ((False, True, False),
                                  ["--min-sdk-version", "24"]),
              "sig-v3-only.apk": ((False, False, True),
                                  ["--min-sdk-version", "28"]),
          }
          for apk, (want_flags, range_args) in schemes.items():
              proc = subprocess.run(
                  [str(bt / "apksigner"), "verify", "--verbose"] + range_args
                  + [str(dist / apk)],
                  capture_output=True, text=True)
              out = proc.stdout + "\n" + proc.stderr
              got = (scheme_flag(out, "v1"), scheme_flag(out, "v2"),
                     scheme_flag(out, "v3"))
              want = tuple("true" if f else "false" for f in want_flags)
              assert got == want, \
                  f"{apk}: esquemas {got} != {want} (rc={proc.returncode})\n" \
                  f"--- saida do apksigner ---\n{out[:1200]}"
              print(f"[A2] ok assinatura: {apk} v1={want_flags[0]} "
                    f"v2={want_flags[1]} v3={want_flags[2]} "
                    f"(range {range_args})")

          # --- unaligned: a patologia é COMPROVÁVEL por dois caminhos —
          # zipalign -c reprova (quando o range de checagens cobre o arsc)
          # e/ou o offset dos dados de entradas armazenadas fica fora do
          # mod 4 (o dealign calibra o resources.arsc para mod 4 == 1).
          # O contraste (fixture normal) aprova em qualquer hipótese.
          def misaligned_stored(path):
              bad = []
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      if info.compress_type == zipfile.ZIP_STORED:
                          off = (info.header_offset + 30
                                 + len(info.filename) + len(info.extra))
                          if off % 4:
                              bad.append((info.filename, off, off % 4))
              return bad

          rc = subprocess.run([str(bt / "zipalign"), "-c", "4",
                               str(dist / "unaligned.apk")],
                              capture_output=True, text=True)
          mis = misaligned_stored(dist / "unaligned.apk")
          assert rc.returncode != 0 or mis, (
              "unaligned: zipalign aprovou E nenhuma entrada armazenada "
              "está fora do mod 4 — a patologia não existe")
          assert misaligned_stored(dist / "sig-v1-only.apk") == [], \
              "contraste: fixture normal não deveria ter stored desalinhado"
          rc2 = subprocess.run([str(bt / "zipalign"), "-c", "4",
                                str(dist / "sig-v1-only.apk")],
                               capture_output=True).returncode
          assert rc2 == 0, "contraste (alinhado) deveria aprovar no zipalign -c"
          print(f"[A2] ok alinhamento: zipalign rc={rc.returncode} "
                f"(esperado != 0); stored fora do mod 4: {mis}; "
                f"contraste aprovou (rc={rc2})")

          # --- zip64: > 65535 entradas (Zip64 EOCD obrigatório)
          with zipfile.ZipFile(dist / "zip64-65k.apk") as zf:
              n = len(zf.infolist())
              assert n > 65535, f"zip64 deveria ter >65535 entradas, tem {n}"
          print(f"[A2] ok zip64: {n} entradas")

          # --- multidex-8: exatamente classes.dex..classes8.dex
          with zipfile.ZipFile(dist / "multidex-8.apk") as zf:
              dexes = sorted(i.filename for i in zf.infolist()
                             if re.fullmatch(r"classes\d*\.dex", i.filename))
              assert len(dexes) == 8, f"esperava 8 dex, achei {dexes}"
          print(f"[A2] ok multidex: {', '.join(dexes)}")

          # --- huge-arsc: sha256 bate com o report commitado + estrutura válida
          with zipfile.ZipFile(dist / "huge-arsc.apk") as zf:
              data = zf.read("resources.arsc")
          report = json.loads(
              Path("suites/parser-torture/huge-arsc/arsc-report.json").read_text(
                  encoding="utf-8"))
          assert hashlib.sha256(data).hexdigest() == report["sha256"], \
              "sha256 do resources.arsc diverge do report commitado"
          Path("/tmp/huge-arsc.resources").write_bytes(data)
          proc = subprocess.run(
              [sys.executable, "tools/gen-arsc-stress.py", "--verify",
               "/tmp/huge-arsc.resources"], capture_output=True, text=True)
          assert proc.returncode == 0, \
              f"verify estrutural do arsc falhou: {proc.stderr}"
          print("[A2] ok huge-arsc: sha256 bate + 10k entradas x 40 locales válidas")

          # --- unknown-perms: exatamente 4 strings inventadas (o xmltree do
          # aapt2 imprime o valor 2x — resolvido e "(Raw: ...)" — dedupe por
          # conjunto; e 5 uses-permission no total: INTERNET + 4 falsas)
          tree = xmltree(dist / "unknown-perms.apk")
          fakes = set(re.findall(r"dev\.apktester\.fake\.[A-Z_]+", tree))
          assert len(fakes) == 4, f"esperava 4 permissões falsas, achei {sorted(fakes)}"
          n_up = len(re.findall(r"^ +E: uses-permission ", tree, re.M))
          assert n_up == 5, f"esperava 5 uses-permission (1 real + 4 falsas), achei {n_up}"
          print(f"[A2] ok unknown-perms: 4 strings dev.apktester.fake.* + "
                f"5 uses-permission")

          # --- exported-audit: 9 componentes declarados, armadilhas no binário
          tree = xmltree(dist / "exported-audit.apk")
          for marker in ("TrapExportedNoPermActivity", "TrapLauncherActivity",
                         "TrapAlias", "TrapExportedService", "TrapBoundService",
                         "TrapOpenReceiver", "TrapOpenProvider",
                         "TrapGrantProvider", "TrapForegroundTypeService"):
              assert marker in tree, \
                  f"componente ausente do manifesto binário: {marker}"
          n_provider = len(re.findall(r"^ +E: provider ", tree, re.M))
          assert n_provider == 2, f"esperava 2 providers, achei {n_provider}"
          n_alias = len(re.findall(r"^ +E: activity-alias ", tree, re.M))
          assert n_alias == 1, f"esperava 1 activity-alias, achei {n_alias}"
          print("[A2] ok exported-audit: 9 componentes + armadilhas no binário")

          # --- obfuscated-r8: mapping.txt dentro do APK + classes a.a.* no dex
          with zipfile.ZipFile(dist / "obfuscated-r8.apk") as zf:
              names = zf.namelist()
              assert "assets/mapping.txt" in names, "mapping.txt ausente do APK"
              mapping = zf.read("assets/mapping.txt").decode("utf-8")
              dex = zf.read("classes.dex")
          assert "a.a.a -> " in mapping, "mapping sem regra a.a.a"
          assert b"La/a/a;" in dex, "classes ofuscadas ausentes do dex"
          print("[A2] ok obfuscated-r8: assets/mapping.txt + a.a.* no dex")
          PY

      - name: Determinismo do empacotador (duas passadas + apk-mode)
        run: |
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          python3 tools/fixture-pack.py --fixture unaligned --out dist2 \
            --aapt2 "${BT}/aapt2" --d8 "${BT}/d8" \
            --apksigner "${BT}/apksigner" --zipalign "${BT}/zipalign"
          bash tools/verify-deterministic.sh --mode apk \
            --apk1 dist/unaligned.apk --apk2 dist2/unaligned.apk

      - name: Upload das fixtures (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: parser-torture-fixtures
          path: dist/*.apk
          if-no-files-found: error

  # A3: fixtures Tier C da matriz de engines — 9 fixtures de detecção
  # sintética e honesta (payload NÃO executável, ADR 0003), empacotadas pela
  # toolchain real e verificadas contra o contrato canônico
  # (contracts/engines/expected-engines.json + tier-c-payload-report.json).
  tier-c-engines:
    name: "Tier C (A3): 9 fixtures de detecção + contratos"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Selftests (empacotador 20 modos + gerador Tier C)
        run: |
          python3 tools/fixture-pack.py --selftest
          python3 tools/gen-engine-fixtures.py --selftest

      - name: Zero drift dos contratos Tier C (sync + diff)
        run: |
          python3 tools/gen-engine-fixtures.py --sync-contracts
          git diff --exit-code -- \
            suites/engines/engine-05-clojure/expected-engines.json \
            suites/engines/engine-11-objc/expected-engines.json \
            suites/engines/engine-18-maui-xamarin/expected-engines.json \
            suites/engines/engine-19-unity-mono/expected-engines.json \
            suites/engines/engine-20-unity-il2cpp/expected-engines.json \
            suites/engines/engine-21-unreal/expected-engines.json \
            suites/engines/engine-27-b4x-appinventor/expected-engines.json \
            suites/engines/engine-29-python-kivy-beeware/expected-engines.json \
            suites/engines/engine-32-twa-pwa/expected-engines.json
          echo "[A3] zero drift: contratos por diretório == contrato canônico"

      - name: Empacotar e verificar as 9 fixtures Tier C (laço compartilhado)
        run: |
          # A9/roadmap 5.5: pack+verify no mesmo laço compartilhado com
          # engines-nightly.yml e release.yml (scripts/pack-tier-c.sh)
          scripts/pack-tier-c.sh dist "${ANDROID_HOME}/build-tools/35.0.0"
          ls -l dist/

      - name: Copiar APKs para os diretórios dos contratos (suite smoke)
        run: |
          for e in engine-05-clojure engine-11-objc engine-18-maui-xamarin \
                   engine-19-unity-mono engine-20-unity-il2cpp \
                   engine-21-unreal engine-27-b4x-appinventor \
                   engine-29-python-kivy-beeware engine-32-twa-pwa; do
            cp "dist/${e}.apk" "suites/engines/${e}/"
          done

      - name: Determinismo do empacotador (duas passadas + apk-mode)
        run: |
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          python3 tools/fixture-pack.py --fixture engine-18-maui-xamarin \
            --out dist2 --aapt2 "${BT}/aapt2" --d8 "${BT}/d8" \
            --apksigner "${BT}/apksigner" --zipalign "${BT}/zipalign"
          bash tools/verify-deterministic.sh --mode apk \
            --apk1 dist/engine-18-maui-xamarin.apk \
            --apk2 dist2/engine-18-maui-xamarin.apk

      - name: Upload dos APKs Tier C (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: tier-c-apks
          path: dist/*.apk
          if-no-files-found: error
