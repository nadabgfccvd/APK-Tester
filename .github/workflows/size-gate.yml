# Size Gate do flagship "Behemoth" (A6 — engenharia de tamanho fechada).
#
# Build do release modern (R8 full + resource shrinking + zipalign + libs
# nativas descomprimidas + carga deterministica tools/gen-bulk.py preset
# "full" ~768 MiB) e gate REAL [850, 1000] MiB com relatorio por categoria
# (contracts/flagship/size-report.csv) e drift check ±2% vs o CSV commitado.
#
# Primeira execucao (A6): baseline commitado ainda e o relatorio A0 zerado —
# o drift check trata categorias com bytes 0 como SKIP por design; a partir
# dai o CSV commitado e o baseline e qualquer crescimento/shrink > ±2% por
# categoria falha o job (mudanca intencional de tamanho exige commit do CSV
# atualizado no mesmo PR).
name: Size Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'suites/flagship/**'
      - 'tools/gen-bulk.py'
      - 'tools/size-budget.sh'
      - 'contracts/flagship/size-report.csv'
      - '.github/workflows/size-gate.yml'
  pull_request:
    paths:
      - 'suites/flagship/**'
      - 'tools/gen-bulk.py'
      - 'tools/size-budget.sh'
      - 'contracts/flagship/size-report.csv'

permissions:
  contents: read
  issues: write

jobs:
  size-gate:
    name: "Flagship release: gate [850 MB, 1000 MB] + drift ±2% (A6)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools 35.0.0)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: "Toolchains dos módulos :native/:rust (R2.2): NDK + CMake + cargo-ndk"
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.31.1" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.2.12479018" >> "${GITHUB_ENV}"
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi
          # std dos alvos android para o cargo-ndk (E0463 sem isto)
          rustup target add aarch64-linux-android x86_64-linux-android
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          cargo ndk --version

      - name: Build do flagship modern release (R8 full + shrink + bulk full)
        run: |
          cd suites/flagship
          # preset bulk "full" e o default do build (property bulkPreset).
          ./gradlew --no-daemon :app:assembleModernRelease

      - name: Gate de tamanho + drift check (tools/size-budget.sh)
        run: |
          APK="suites/flagship/app/build/outputs/apk/modern/release/app-modern-release.apk"
          test -f "${APK}"
          mkdir -p dist
          # Escreve o relatorio fresco em dist/ (artefato), aplica o gate
          # [850, 1000] MiB e o drift ±2% por categoria vs o CSV commitado.
          tools/size-budget.sh --apk "${APK}" \
            --baseline contracts/flagship/size-report.csv \
            --report dist/size-report.csv \
            --min-mb 850 --max-mb 1000
          ls -la "${APK}"
          sha256sum "${APK}" | tee dist/flagship-release.sha256

      - name: Determinismo do gerador de carga (gen-bulk selftest)
        run: |
          python3 tools/gen-bulk.py --selftest
          rm -rf /tmp/gb1 /tmp/gb2
          python3 tools/gen-bulk.py --out /tmp/gb1 --preset quick
          python3 tools/gen-bulk.py --out /tmp/gb2 --preset quick
          diff -r /tmp/gb1 /tmp/gb2
          python3 tools/gen-bulk.py --verify /tmp/gb1
          echo "[A6] gen-bulk: determinismo byte a byte + verify OK"

      - name: Upload do size-report.csv (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: |
            dist/size-report.csv
            dist/flagship-release.sha256
          if-no-files-found: warn
      # R3.3 (AUDIT_ROADMAP_V2): o gate de tamanho fora da janela não pode
      # depender de alguém olhar o run — falha abre issue `ci` automática
      # com o run/commit (mesma mecânica do notify-failure do nightly).
      - name: Abrir issue em falha do gate (R3.3)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo '## Size Gate fora da janela (drift ou total)'
            echo ''
            echo 'O gate [850, 1000] MiB / drift ±2% por categoria falhou.'
            echo 'Relatório fresco no artefato `size-report` deste run.'
            echo ''
            echo "- Run: ${RUN_URL}"
            echo "- Commit: ${COMMIT}"
            echo ''
            echo '## Próximos passos'
            echo '1. Comparar dist/size-report.csv com contracts/flagship/size-report.csv.'
            echo '2. Crescimento intencional: re-baseline medido no CI (padrão A9), nunca estimado à mão.'
            echo '3. Crescimento acidental: investigar o delta por categoria antes do re-baseline.'
          } > /tmp/size-issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --label ci \
            --title "size-gate: flagship fora da janela/drift (run ${{ github.run_id }})" \
            --body-file /tmp/size-issue-body.md
