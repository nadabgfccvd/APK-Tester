# Canary de teste R0.2 (AUDIT_ROADMAP_V2) — BRANCH DE TESTE, remover após
# a simulação. Prova a mecânica do auto-issue: job propositalmente falho ->
# notify-test abre issue com run/commit no corpo (mesma mecânica do
# notify-failure do engines-nightly.yml).
name: R02 Notify Canary

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary-fail:
    name: "Job propositalmente falho (simulacao R0.2)"
    runs-on: ubuntu-latest
    steps:
      - name: Falhar de propósito
        run: |
          echo "[canary] falha proposital para provar o auto-issue do R0.2"
          exit 1

  notify-test:
    name: Auto-issue em falha (mecânica R0.2)
    needs: [canary-fail]
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Abrir issue com run/commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo '## Canary R0.2: auto-issue em falha de BUILD'
            echo ''
            echo 'Issue de TESTE da mecânica R0.2 (branch `test/r02-notify-canary`).'
            echo 'Será fechada automaticamente após a verificação.'
            echo ''
            echo '- Run: '"${RUN_URL}"
            echo '- Commit: '"${COMMIT}"
          } > /tmp/issue-body.md
          gh issue create \
            --label ci \
            --title "test: canary R0.2 auto-issue (run ${{ github.run_id }})" \
            --body-file /tmp/issue-body.md
