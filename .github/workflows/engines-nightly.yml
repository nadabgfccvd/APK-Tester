# Engines Nightly — A7: builds REAIS do Tier B + compat-nightly + docs site.
# ADR 0002: toolchains pesadas ficam GATED no nightly (fail-fast: false);
# a build de PR nunca espera por elas (ci.yml roda só selftest/plan-only).
# O job compat-nightly roda scripts/compat-nightly.sh contra TODOS os
# fixtures (Tier B real + Tier C empacotada) e publica docs/compat-matrix.md
# no GH Pages junto do site mdBook (job docs-pages).
name: Engines Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

env:
  BT: "35.0.0"

jobs:
  # ------------------------------------------------------------------
  # Tier B: builds REAIS dos 9 engines com toolchains pesadas pinadas.
  # A toolchain é baixada da fonte oficial pelo tools/build-tier-b.py
  # (Maven Central / npm / NuGet / GitHub Releases / aqt / Flutter SDK)
  # para a árvore de trabalho — nada de binário commitado.
  # ------------------------------------------------------------------
  tier-b-matrix:
    name: "Tier B build real (A7): ${{ matrix.engine }}"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { engine: engine-04-scala, java: "21" }
          - { engine: engine-13-flutter, java: "17" }
          - { engine: engine-14-react-native, java: "17" }
          - { engine: engine-15-cordova, java: "17" }
          - { engine: engine-17-nativescript, java: "17" }
          # bob.jar 1.9.8 é class-file 65 (Java 21+)
          - { engine: engine-22-lua-defold, java: "21" }
          - { engine: engine-23-godot, java: "17" }
          - { engine: engine-26-qt-qml, java: "17" }
          - { engine: engine-28-avalonia-dotnet, java: "17" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"

      - name: Componentes Android SDK (platform-tools + platform 36 + build-tools)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;${BT}" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Build real do engine (toolchain pinada baixada da fonte)
        run: |
          mkdir -p reports
          BT_DIR="${ANDROID_HOME}/build-tools/${BT}"
          python3 tools/build-tier-b.py \
            --engine "${{ matrix.engine }}" \
            --out "suites/engines/${{ matrix.engine }}/dist" \
            --report "reports/${{ matrix.engine }}.json" \
            --aapt2 "${BT_DIR}/aapt2" --d8 "${BT_DIR}/d8" \
            --apksigner "${BT_DIR}/apksigner" \
            --zipalign "${BT_DIR}/zipalign"

      - name: Verificar o APK contra o contrato (artefatos do detector)
        run: |
          python3 tools/build-tier-b.py \
            --verify-apk "suites/engines/${{ matrix.engine }}/dist/${{ matrix.engine }}.apk" \
            --engine "${{ matrix.engine }}"

      - name: Upload do APK + report (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: tier-b-${{ matrix.engine }}
          path: |
            suites/engines/${{ matrix.engine }}/dist/${{ matrix.engine }}.apk
            reports/${{ matrix.engine }}.json
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Tier C: re-empacota as 9 fixtures honestas para a matriz nightly
  # (barato: toolchain real do SDK, sem toolchain externa).
  # ------------------------------------------------------------------
  tier-c-fixtures:
    name: "Tier C fixtures (A3) para a matriz nightly"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Componentes Android SDK (platform 36 + build-tools)
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;${BT}" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Selftests (empacotador 21 modos + gerador Tier C)
        run: |
          python3 tools/fixture-pack.py --selftest
          python3 tools/gen-engine-fixtures.py --selftest

      # A9/roadmap 3.3: o corpus-fonte COMPLETO do gen-dex-stress (650
      # classes x 101 rotinas = 65.650 method refs, acima do limite 65.536
      # de um dex) atravessando o d8 DE VERDADE — 8 lotes contíguos, um
      # classesN.dex por lote. ~1 min no runner; PR CI segue com o modo
      # reduzido (multidex-8, 7.680 rotinas).
      - name: Multidex-8-full (corpus 65k completo pelo d8 real)
        run: |
          set -euo pipefail
          BT_DIR="${ANDROID_HOME}/build-tools/${BT}"
          mkdir -p /tmp/mdf
          python3 tools/fixture-pack.py --fixture multidex-8-full \
            --out /tmp/mdf \
            --aapt2 "${BT_DIR}/aapt2" --d8 "${BT_DIR}/d8" \
            --apksigner "${BT_DIR}/apksigner" --zipalign "${BT_DIR}/zipalign"
          python3 - "${BT_DIR}" <<'PY'
          import os, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          bt = Path(sys.argv[1])
          apk = Path("/tmp/mdf/multidex-8-full.apk")
          with zipfile.ZipFile(apk) as zf:
              dexes = sorted(n for n in zf.namelist()
                             if n.startswith("classes") and n.endswith(".dex"))
          expected = ["classes.dex"] + [f"classes{i}.dex" for i in range(2, 9)]
          assert dexes == expected, f"dexes divergem: {dexes}"
          total = 0
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile(apk) as zf:
                  zf.extractall(td)
              for name in dexes:
                  out = subprocess.run([str(bt / "dexdump"), "-f",
                                        os.path.join(td, name)],
                                      capture_output=True, text=True).stdout
                  n = int(next(l.split(":")[1] for l in out.splitlines()
                               if l.startswith("method_ids_size")))
                  print(f"[A9] {name}: {n} method_ids")
                  total += n
          assert total >= 65536 + 1024, \
              f"total de method_ids ({total}) abaixo do esperado p/ corpus 65k"
          print(f"[A9] multidex-8-full OK: 8 dexes, {total} method_ids no "
                f"total (corpus 65.650 rotinas atravessou o d8 real)")
          PY

      - name: Empacotar as 9 fixtures Tier C
        run: |
          # laço compartilhado (A9/roadmap 5.5): empacota E verifica cada
          # fixture contra o contrato em uma única chamada
          scripts/pack-tier-c.sh dist "${ANDROID_HOME}/build-tools/${BT}"
          # posiciona os APKs nos diretórios das suítes (layout do artefato
          # preservado: suites/engines/<engine>/dist/<engine>.apk)
          for e in engine-05-clojure engine-11-objc engine-18-maui-xamarin \
                   engine-19-unity-mono engine-20-unity-il2cpp \
                   engine-21-unreal engine-27-b4x-appinventor \
                   engine-29-python-kivy-beeware engine-32-twa-pwa; do
            mkdir -p "suites/engines/$e/dist"
            cp "dist/$e.apk" "suites/engines/$e/dist/$e.apk"
          done

      - name: Upload das fixtures Tier C (artefato de CI)
        uses: actions/upload-artifact@v4
        with:
          name: tier-c-apks
          path: suites/engines/*/dist/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------
  # compat-nightly: roda o RustyDroid (se disponível) contra TODOS os
  # fixtures com APK e agrega docs/compat-matrix.md. Sem rustydroid no
  # runner, todas as linhas viram SKIP e o job passa (lei do script).
  # ------------------------------------------------------------------
  compat-nightly:
    name: Compat nightly (RustyDroid x fixtures)
    needs: [tier-b-matrix, tier-c-fixtures]
    if: ${{ always() && needs.tier-b-matrix.result != 'cancelled' && needs.tier-c-fixtures.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar APKs Tier B (9 engines reais)
        uses: actions/download-artifact@v4
        with:
          pattern: tier-b-*
          path: .
          merge-multiple: true

      - name: Baixar e posicionar as fixtures Tier C
        uses: actions/download-artifact@v4
        with:
          name: tier-c-apks
          path: tier-c-staging

      - name: Copiar Tier C para os diretórios dos contratos
        run: |
          # o upload preserva a estrutura a partir de suites/engines/;
          # localizamos os .apk recursivamente
          find tier-c-staging -type f -name '*.apk' | while read -r apk; do
            base="$(basename "$apk" .apk)"
            mkdir -p "suites/engines/$base/dist"
            cp "$apk" "suites/engines/$base/dist/$base.apk"
          done
          ls suites/engines/*/dist/*.apk | wc -l

      - name: Rodar scripts/compat-nightly.sh
        run: bash scripts/compat-nightly.sh

      - name: Upload de docs/compat-matrix.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-matrix
          path: docs/compat-matrix.md
          if-no-files-found: error

      - name: Abrir issue fixture_gap em regressão
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Regressão de compatibilidade (nightly)'
            echo ''
            echo 'O job `compat-nightly` falhou: um ou mais fixtures divergem do answer key'
            echo '(`contracts/engines/expected-engines.json`) ou o `rustydroid inspect --json` reprovou.'
            echo ''
            echo '- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            echo '- Matriz completa: artefato `compat-matrix` deste run (`docs/compat-matrix.md`).'
            echo ''
            echo '## Próximos passos'
            echo '1. Baixar o artefato `compat-matrix` e listar os engines com FAIL.'
            echo '2. Reproduzir localmente com `bash scripts/compat-nightly.sh`.'
            echo '3. Corrigir o fixture OU o detector (ADR 0003: detecção não valida payload nem autoriza execução).'
          } > /tmp/issue-body.md
          gh issue create \
            --label fixture_gap \
            --title "fixture_gap: regressão de compatibilidade no nightly (run ${{ github.run_id }})" \
            --body-file /tmp/issue-body.md

  # ------------------------------------------------------------------
  # docs-pages: publica o SITE mdBook completo + a matriz de
  # compatibilidade fresca no GH Pages.
  # ------------------------------------------------------------------
  docs-pages:
    name: Docs site (mdBook) + matriz de compatibilidade (GH Pages)
    needs: [compat-nightly]
    if: ${{ always() && needs.compat-nightly.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar compat-matrix fresca (página do site)
        uses: actions/download-artifact@v4
        with:
          name: compat-matrix
          path: staging-matrix

      - name: Posicionar a matriz como página do site
        run: |
          mkdir -p docs/src
          find staging-matrix -name compat-matrix.md \
            -exec cp {} docs/src/compat-matrix.md \;
          test -f docs/src/compat-matrix.md
          echo "[A7] compat-matrix.md posicionada no src do site"

      - name: Instalar mdbook (pinado)
        run: |
          curl -sSL -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/mdbook.tar.gz -C /usr/local/bin
          mdbook --version

      - name: Build do site (mdBook)
        run: mdbook build docs

      - name: Empacotar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      - name: Deploy no GH Pages
        id: deployment
        uses: actions/deploy-pages@v4
