[package]
name = "wasmer_host"
version = "1.0.0"
edition = "2021"
publish = false
description = "engine-30 (Tier A, A4): host WASM real (crate wasmer 7, singlepass) do APK Tester"

[lib]
name = "wasmer"
crate-type = ["cdylib"]

[dependencies]
# Runtime WASM real: engine sys com compilador singlepass (sem cranelift
# nem cache — build enxuto para android x86_64).
wasmer = { version = "7", default-features = false, features = [
    "sys",
    "singlepass",
] }

[profile.release]
opt-level = 2
strip = false
