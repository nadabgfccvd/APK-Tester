# JVM do daemon Gradle: heap 3g e encoding UTF-8 para fontes Java com textos PT-BR.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# A escada e framework-only (nenhuma dependencia androidx): a flag fica
# explicitamente false. O AGP 8 so exige true quando ha dependencias androidx
# no classpath — e o degrau minSdk 9 nao pode ter nenhuma.
android.useAndroidX=false
# R classes nao transitivas: escopo por modulo (a escada tem so :app).
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
# compileSdk 36 com AGP 8.9.2 (testado oficialmente ate 35): suprime apenas o
# aviso de versao, sem alterar o comportamento do build.
android.suppressUnsupportedCompileSdk=36
