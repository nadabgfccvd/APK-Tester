# JVM do daemon Gradle: heap 3g e encoding UTF-8 para fontes Java com textos PT-BR.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# A1 e framework-only (nenhuma dependencia androidx); a flag e requisito do
# AGP 8 e nao adiciona dependencias ao classpath.
android.useAndroidX=true
# R classes nao transitivas: escopo por modulo (hoje so :app; :sim3d/:native entram em A5+).
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
# compileSdk 36 com AGP 8.9.2 (testado oficialmente ate 35): suprime apenas o
# aviso de versao, sem alterar o comportamento do build.
android.suppressUnsupportedCompileSdk=36
